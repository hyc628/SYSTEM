<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>登入 - 會計系統</title>
  <style>
    * { box-sizing: border-box; font-family: "Microsoft JhengHei", Arial, sans-serif; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1B2A4E 0%, #0F1B33 100%);
      position: relative;
      overflow: hidden;
      transition: background 0.3s;
    }
    body.dark-mode {
      background: linear-gradient(135deg, #0a0f14 0%, #05080c 100%);
    }
    body::before {
      content: "";
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46,204,113,0.15), transparent 70%);
      top: -150px; right: -150px;
    }
    body::after {
      content: "";
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52,152,219,0.15), transparent 70%);
      bottom: -120px; left: -120px;
    }
    .card {
      width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.98);
      border-radius: 20px;
      padding: 32px 32px 24px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.5);
      animation: pop 0.4s ease;
      position: relative;
      z-index: 1;
      transition: background 0.3s, color 0.3s;
    }
    body.dark-mode .card {
      background: rgba(26, 32, 40, 0.98);
      color: #e0e6ed;
    }
    @keyframes pop {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .logo { text-align: center; margin-bottom: 6px; }
    .logo img {
      width: 72px; height: 72px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(27,42,78,0.25);
    }
    .title {
      text-align: center; font-size: 22px; font-weight: bold;
      color: #1B2A4E; margin-bottom: 2px; letter-spacing: 1px;
      transition: color 0.3s;
    }
    body.dark-mode .title { color: #87ceeb; }
    .brand-sub {
      text-align: center; font-size: 10px; color: #2ECC71;
      font-weight: bold; letter-spacing: 3px; margin-bottom: 10px;
    }
    .subtitle {
      text-align: center; font-size: 13px;
      color: #888; margin-bottom: 18px;
      transition: color 0.3s;
    }
    body.dark-mode .subtitle { color: #8095b0; }
    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 12.5px;
      color: #1B2A4E; margin-bottom: 5px; font-weight: 600;
      transition: color 0.3s;
    }
    body.dark-mode .field label { color: #87ceeb; }
    .field input {
      width: 100%; padding: 10px 13px; font-size: 14px;
      border: 2px solid #e0e6ed; border-radius: 9px;
      outline: none; transition: all 0.2s;
      background: #f8fafc;
    }
    body.dark-mode .field input {
      background: #1e262f;
      color: #e0e6ed;
      border-color: #3a4652;
    }
    .field input:focus {
      border-color: #2ECC71;
      background: white;
      box-shadow: 0 0 0 4px rgba(46,204,113,0.12);
    }
    body.dark-mode .field input:focus {
      background: #252e3a;
    }
    .field-hint {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    body.dark-mode .field-hint { color: #7d8ba0; }
    .remember-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    .remember-row input[type="checkbox"] {
      width: 16px; height: 16px;
      cursor: pointer;
      accent-color: #2ECC71;
    }
    .remember-row label {
      margin: 0; cursor: pointer;
      font-size: 13px; color: #1B2A4E; font-weight: 500;
      transition: color 0.3s;
    }
    body.dark-mode .remember-row label { color: #87ceeb; }
    .forgot-row {
      text-align: right;
      margin-bottom: 10px;
    }
    .forgot-row a {
      font-size: 12.5px;
      color: #3498DB;
      cursor: pointer;
      text-decoration: none;
    }
    .forgot-row a:hover {
      text-decoration: underline;
    }
    .btn {
      width: 100%; padding: 11px; font-size: 15px; font-weight: bold;
      border: none; border-radius: 9px; cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #2ECC71, #27AE60);
      transition: all 0.2s;
      margin-top: 6px;
      box-shadow: 0 4px 12px rgba(46,204,113,0.35);
      letter-spacing: 1px;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(46,204,113,0.45);
    }
    .btn:disabled {
      background: #cbd5e1; cursor: not-allowed;
      transform: none; box-shadow: none;
    }
    .switch-mode {
      text-align: center; font-size: 13px;
      color: #666; margin-top: 14px;
      transition: color 0.3s;
    }
    body.dark-mode .switch-mode { color: #a8b5cc; }
    .switch-mode a {
      color: #2ECC71; cursor: pointer;
      text-decoration: none; font-weight: bold;
      margin-left: 4px;
    }
    .switch-mode a:hover { text-decoration: underline; }
    .error {
      color: #e74c3c; font-size: 13px; text-align: center;
      min-height: 18px; margin-top: 6px;
    }
    .footer-note {
      text-align: center; font-size: 10.5px;
      color: #bbb; margin-top: 14px;
    }
    body.dark-mode .footer-note { color: #6b7886; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>
    <div class="title">會計系統</div>
    <div class="brand-sub">ACCOUNTING SYSTEM</div>
    <div class="subtitle" id="subtitle">請登入您的帳號</div>

    <div class="field" id="username-field">
      <label>使用者名稱</label>
      <input type="text" id="username" placeholder="例如：小明、alice" autocomplete="off">
      <div class="field-hint" id="username-hint"></div>
    </div>

    <div class="field" id="email-field" style="display:none">
      <label>電子郵件</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="off">
      <div class="field-hint">用於帳號救援與登入驗證，不會公開</div>
    </div>

    <div class="field">
      <label>密碼</label>
      <input type="password" id="password" placeholder="至少 6 個字元">
    </div>

    <div class="field" id="confirm-field" style="display:none">
      <label>確認密碼</label>
      <input type="password" id="confirm" placeholder="請再輸入一次密碼">
    </div>

    <div class="remember-row" id="remember-row">
      <input type="checkbox" id="remember-me">
      <label for="remember-me">記住我（下次開啟自動登入）</label>
    </div>

    <div class="forgot-row" id="forgot-row">
      <a id="forgot-password-link">忘記密碼？</a>
    </div>

    <button class="btn" id="submit-btn">登入</button>
    <div class="error" id="error-msg"></div>

    <div class="switch-mode">
      <span id="switch-text">還沒有帳號？</span>
      <a id="switch-link">註冊新帳號</a>
    </div>

    <div class="footer-note">© Accounting System v2.0.0 ｜ Powered by Firebase</div>
  </div>

  <script>
    // 載入深色模式
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const darkMode = await window.api.getDarkMode();
        if (darkMode) document.body.classList.add('dark-mode');
      } catch (e) {}
    });
  </script>
  <script src="dialog.js"></script>
  <script src="login.js"></script>
</body>
</html>
